# A room's presence lighting with the blind gate added.
# - Only the turn-ON branch checks the flag. The turn-OFF branch is never gated,
#   so the flag can never hold a light on.
# - The check is "not on", so if the helper is ever unavailable the lights still
#   work (the old phantom returns, which is the safe way to fail).
# - The flag turning off is also a trigger, so someone who walked in during the
#   90 s window still gets their light once it clears.
alias: Guest room - presence lights
triggers:
  - trigger: state
    entity_id: binary_sensor.guest_room_presence
    to: "on"
    id: occupied
  - trigger: state
    entity_id: input_boolean.blinds_moving
    to: "off"
    id: occupied
  - trigger: state
    entity_id: binary_sensor.guest_room_presence
    to: "off"
    for:
      minutes: 2
    id: cleared
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: occupied
          - condition: not
            conditions:
              - condition: state
                entity_id: input_boolean.blinds_moving
                state: "on"
          - condition: state
            entity_id: binary_sensor.guest_room_presence
            state: "on"
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.guest_room
      - conditions:
          - condition: trigger
            id: cleared
        sequence:
          - action: light.turn_off
            target:
              entity_id: light.guest_room
mode: single
